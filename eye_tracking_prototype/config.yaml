# config.yaml — Eye Tracking Prototype Configuration
# Edit values here to tune the prototype without touching any code.

# ─────────────────────────────────────────────
# Webcam settings
# ─────────────────────────────────────────────
webcam:
  device_index: 1          # 0 = default webcam; try 1 for external cam
  fps_target: 60           # Target FPS: 30 or 60
  width: 640
  height: 480
  flip_horizontal: true    # Mirror camera feed so movement matches screen
  async_capture: true      # Enable multithreaded capture buffer for high FPS

# ─────────────────────────────────────────────
# Grid settings
# ─────────────────────────────────────────────
grid:
  rows: 3
  cols: 3

  # Section label for each cell [row][col]
  # Use null for untracked / outside IDE cells
  section_map:
    - ["sidebar",  "main_file", "ai_agent"   ]
    - ["sidebar",  "main_file", "second_file"]
    - ["terminal", "terminal",  "terminal"   ]

  # Colours for each section in the grid overlay (BGR format)
  section_colors:
    sidebar:      [200, 100,  50]   # blue-ish
    main_file:    [ 50, 180,  50]   # green
    ai_agent:     [180,  50, 180]   # purple
    second_file:  [180, 180,  50]   # cyan-ish
    terminal:     [ 50, 140, 200]   # orange-ish

# ─────────────────────────────────────────────
# Smoothing filter
# Options: "ema" | "kalman" | "median" | "none"
# ─────────────────────────────────────────────
filter:
  type: "ema"              # <── change this to switch filter

  # EMA — Exponential Moving Average
  # Low latency, slight jitter. Good default for 30/60 fps.
  # alpha: 0.1 = very smooth, 0.9 = very responsive
  ema_alpha: 0.3

  # Kalman — best accuracy, adds ~20–30ms latency
  # Requires: pip install filterpy
  kalman_process_noise: 0.1
  kalman_measurement_noise: 4.0

  # Median — robust to blink spikes, good for unstable lighting
  # median_window: number of frames to median over
  median_window: 5

# ─────────────────────────────────────────────
# Dwell time & Metrics
# ─────────────────────────────────────────────
dwell:
  threshold_ms: 300        # min ms before gaze counts as intentional

metrics:
  transition_window_sec: 5.0 # rolling window for gaze transition rate

# ─────────────────────────────────────────────
# Calibration & Gaze Mapping
# ─────────────────────────────────────────────
calibration:
  n_samples_per_point: 30  # frames to collect per calibration dot
  move_delay_sec: 2.0      # countdown time before collecting samples for a dot
  dot_radius: 20           # pixels
  dot_color_bgr: [0, 0, 255]  # red dot
  stability_threshold: 0.015  # max normalized drift allowed during gaze hold
  stability_required_frames: 6 # frames gaze must remain still before collecting
  mapping_method: "hybrid" # Options: "hybrid" (Poly X + Ridge Y w/ EAR) | "polynomial" | "affine" | "homography"

# ─────────────────────────────────────────────
# Iris baseline (for pupil-dilation proxy)
# ─────────────────────────────────────────────
iris:
  baseline_frames: 60      # frames to average for baseline iris size

# ─────────────────────────────────────────────
# Output / data recording
# ─────────────────────────────────────────────
output:
  session_dir: "./sessions"
  csv_buffer_size: 60      # flush CSV every N frames (lower = safer, more I/O)
  save_video: false        # set true to save annotated mp4 (adds CPU + storage)

# ─────────────────────────────────────────────
# MediaPipe model & Landmarks
# ─────────────────────────────────────────────
mediapipe:
  model_path: "./models/face_landmarker.task"
  num_faces: 1
  min_face_detection_confidence: 0.5
  min_face_presence_confidence: 0.5
  min_tracking_confidence: 0.5

  # Landmark Indices (MediaPipe Face Mesh Standard)
  landmarks:
    left_iris: [468, 469, 470, 471, 472]
    right_iris: [473, 474, 475, 476, 477]
    left_eye_corners: [33, 133]      # outer (33), inner (133)
    right_eye_corners: [362, 263]    # inner (362), outer (263)
    left_eyelid: [159, 145, 133, 33]  # top (159), bottom (145), inner (133), outer (33)
    right_eyelid: [386, 374, 263, 362] # top (386), bottom (374), outer (263), inner (362)
