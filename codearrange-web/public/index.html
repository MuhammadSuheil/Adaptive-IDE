<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Arrange &mdash; Belajar Java dengan Menyusun Kode</title>
  <link rel="stylesheet" href="/styles.css?v=5" />
</head>
<body>
  <header>
    <h1>Code Arrange</h1>
    <p class="subtitle">Geser dan susun potongan kode ke urutan yang tepat untuk membangun program.</p>
  </header>

  <main>
    <!-- ---- Layar awal: ditampilkan sampai peserta menekan tombol Mulai ---- -->
    <section id="start-screen">
      <div class="start-card">
        <div class="field-row">
          <label>Nama Peserta</label>
          <p id="player-name-display" class="locked-name">Memuat&hellip;</p>
        </div>
        <div class="field-row">
          <label for="puzzle-select">Pilih Soal</label>
          <select id="puzzle-select"></select>
        </div>
        <button id="start-btn">Mulai</button>
        <p id="start-error" class="feedback error"></p>
      </div>
    </section>

    <!-- ---- Layar soal: ditampilkan setelah tombol Mulai ditekan ---- -->
    <section id="puzzle-screen" class="hidden">
      <div class="puzzle-meta">
        <span id="active-player"></span>
        <span class="badges">
          <span id="active-puzzle-mode" class="type-badge mode-badge"></span>
          <span id="active-puzzle-type" class="type-badge"></span>
        </span>
        <span id="timer">0:00</span>
      </div>

      <section class="description-box">
        <h2>Deskripsi</h2>
        <div id="description-content"></div>
        <p id="mode-hint" class="mode-hint hidden"></p>
      </section>

      <section class="panels">
        <div class="panel">
          <h3>Baris Kode Tersedia</h3>
          <ul id="available-list" class="line-list"></ul>
        </div>
        <div class="panel">
          <h3>Program Anda</h3>
          <ul id="solution-list" class="line-list"></ul>
        </div>
      </section>

      <section class="actions">
        <button id="finish-btn">Selesai</button>
        <button id="try-again-btn" class="secondary">Coba Lagi</button>
        <button id="next-puzzle-btn" class="secondary" disabled>Soal Berikutnya</button>
        <p id="feedback" class="feedback"></p>
      </section>

      <section id="explanation-box" class="description-box hidden">
        <h2>Penjelasan</h2>
        <div id="explanation-content"></div>
      </section>
    </section>
  </main>

  <!-- Review mode: ditampilkan setelah tombol Selesai jika server dijalankan dengan --review. -->
  <div id="rating-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <p id="rating-feedback" class="feedback"></p>
      <h2>Tingkat Kesulitan</h2>
      <p>Dalam skala 1 (sangat mudah) hingga 10 (sangat sulit), seberapa sulit soal ini menurut Anda?</p>
      <div id="rating-buttons" class="rating-buttons"></div>
    </div>
  </div>

  <script src="/app.js?v=5"></script>
</body>
</html>
